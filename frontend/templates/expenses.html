{% extends "base.html" %}
{% block title %}Expenses - SmartSpend AI{% endblock %}
{% block body %}
<div class="app-shell">
  {% include "partials_nav.html" %}
  <main class="workspace">
    <header class="page-head"><div><p class="eyebrow">Real-time spending ledger</p><h1>Expense Manager</h1></div><button class="btn primary" id="voiceExpense">Voice Input</button></header>
    <section class="panel glass">
      <form id="expenseForm" class="expense-form">
        <input type="hidden" name="id">
        <input name="amount" type="number" step="0.01" placeholder="Amount" required>
        <select name="category"></select>
        <input name="description" placeholder="Description">
        <input name="date" type="date" required>
        <select name="payment_method"><option>Card</option><option>UPI</option><option>Cash</option><option>Bank Transfer</option></select>
        <input name="notes" placeholder="Notes">
        <button class="btn primary" type="submit">Save Expense</button>
      </form>
    </section>
    <section class="panel glass">
      <div class="filters"><input id="expenseSearch" placeholder="Search expenses"><select id="expenseCategory"><option value="">All categories</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th>Amount</th><th></th></tr></thead><tbody id="expenseRows"></tbody></table></div>
    </section>
  </main>
</div>
{% endblock %}
{% block scripts %}<script>SmartSpend.expenses();</script>{% endblock %}
