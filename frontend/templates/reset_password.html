{% extends "base.html" %}
{% block title %}Reset Password - SmartSpend AI{% endblock %}
{% block body %}
<main class="auth-page">
  <section class="auth-card glass">
    <a class="brand" href="/"><span class="brand-mark">$</span><span>SmartSpend AI</span></a>
    <form id="resetForm" class="auth-form">
      <h1>Choose a new password</h1>
      <input name="password" type="password" placeholder="New password" minlength="8" required>
      <button class="btn primary" type="submit">Update Password</button>
    </form>
    <p id="resetMessage" class="toast-line"></p>
  </section>
</main>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("resetForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const res = await fetch("/api/reset-password/{{ token }}", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.fromEntries(new FormData(event.target)))
  });
  const data = await res.json();
  document.getElementById("resetMessage").textContent = data.message || data.error;
  if (res.ok) setTimeout(() => location.href = "/login", 900);
});
</script>
{% endblock %}
